# Beattastic Bot – nginx Reverse Proxy mit WebSocket-Support
# ─────────────────────────────────────────────────────────────────────────────
# Installieren:
#   sudo cp nginx.conf /etc/nginx/sites-available/beattastic-bot
#   sudo ln -s /etc/nginx/sites-available/beattastic-bot /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.deine-domain.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.deine-domain.com;           # <-- Subdomain anpassen
    return 301 https://$host$request_uri;       # HTTP → HTTPS redirect
}

server {
    listen 443 ssl http2;
    server_name api.deine-domain.com;           # <-- Subdomain anpassen

    # SSL-Zertifikat (wird von certbot automatisch eingetragen)
    ssl_certificate     /etc/letsencrypt/live/api.deine-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.deine-domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Content-Type-Options  "nosniff"             always;
    add_header X-Frame-Options         "DENY"                always;
    add_header Referrer-Policy         "strict-origin"       always;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket-Upgrade – WICHTIG für wss:// Verbindungen
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_read_timeout  86400;    # WebSocket-Verbindungen offen halten
        proxy_send_timeout  86400;
        proxy_cache_bypass  $http_upgrade;
    }
}
